<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Malaysia Vehicle Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", sans-serif;
      color: #2a3544;
      background: #f3f0e8;
    }
    main { max-width: 880px; margin: 0 auto; padding: 48px 20px 64px; }
    h1 { font-family: Fraunces, serif; font-size: 2.4rem; line-height: 1.1; margin: 0 0 10px; }
    p { margin: 0; color: #5d6b7a; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 28px; }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #fff;
      border: 1px solid #e6dfd2;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(42, 53, 68, 0.06);
    }
    a.card:hover { border-color: #c8960f; }
    a.card strong { display: block; font-family: Fraunces, serif; font-size: 1.6rem; margin-bottom: 8px; }
    a.card span { color: #c8960f; font-size: 0.85rem; font-weight: 600; }
    @media (max-width: 700px) { .choices { grid-template-columns: 1fr; } h1 { font-size: 2rem; } }
  </style>
</head>
<body>
  <main>
    <h1>Two versions of the same site</h1>
    <p>Open either link. v3 uses the previous cleaned national file. v4 uses the state-level file from the zip.</p>
    <div class="choices">
      <a class="card" href="v3/index.html">
        <span>Previous data</span>
        <strong>Version 3</strong>
        <p>National totals, 6 fuel groups, no state column.</p>
      </a>
      <a class="card" href="v4/index.html">
        <span>Zip file</span>
        <strong>Version 4</strong>
        <p>One row per state, 14 fuel names, and the zip model.</p>
      </a>
    </div>
  </main>
</body>
</html>
